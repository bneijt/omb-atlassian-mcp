[package]
name = "omb-atlassian-mcp"
version = "0.1.0"
edition = "2024"
description = "On-my-behalf Atlassian MCP server: reuses your Edge Atlassian session cookie to give an agent read access to Confluence and Jira."
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.5", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
url = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
thiserror = "2"
# Chromium cookie ciphers: AES-128-CBC (Linux, macOS) and AES-256-GCM (Windows).
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
base64 = "0.22"
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"

# The Secret Service (D-Bus) lookup only exists on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

# DPAPI, for the Windows "Safe Storage" key in `Local State`.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
