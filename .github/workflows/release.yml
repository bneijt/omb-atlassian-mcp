name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: my-cli-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: my-cli-windows.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: my-cli-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p staging
          # Copy binary and rename appropriately
          cp target/${{ matrix.target }}/release/my-cli* staging/${{ matrix.bin_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargo-artifact-${{ matrix.target }}
          path: staging/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub Releases and upload assets
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-storage: true # Collects files from all matrix jobs into 'dist/'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
