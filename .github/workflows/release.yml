name: Release

# Build and publish the server when a `v*` tag is pushed.
#
# There is deliberately no Windows or macOS job. This server reads the Edge cookie
# database from a Chromium profile and gets its key from the Secret Service over
# D-Bus; the keyring dependency only builds on Linux, and the platform is Linux-only
# by design. To add a target later, add a matrix entry with its own `runs-on` and
# `target`, and give each artifact a distinct name.

on:
  push:
    tags:
      - 'v*' # e.g. v0.1.0

permissions:
  contents: write # create the release and upload assets

env:
  CARGO_TERM_COLOR: always
  BIN: omb-atlassian-mcp
  ASSET: omb-atlassian-mcp-linux-x86_64

jobs:
  release:
    name: Release (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Prepare assets
        run: |
          set -euo pipefail
          echo "built: $(./target/release/$BIN --version)"
          mkdir -p staging
          install -m 0755 "target/release/$BIN" "staging/$ASSET"
          (cd staging && sha256sum "$ASSET" > "$ASSET.sha256")
          ls -l staging

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omb-atlassian-mcp-linux-x86_64
          path: staging/
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/*
          fail_on_unmatched_files: true
