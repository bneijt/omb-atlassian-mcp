name: Release

# Build and publish the server when a `v*` tag is pushed: one asset per supported
# platform, each with a sha256 checksum. Nothing is published unless the tests pass.
#
# macOS ships a universal binary (arm64 + x86_64) so users do not have to pick.

on:
  push:
    tags:
      - 'v*' # e.g. v0.1.0

permissions:
  contents: write # create the release and upload assets

env:
  CARGO_TERM_COLOR: always
  BIN: omb-atlassian-mcp

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: omb-atlassian-mcp-linux-x86_64
          - os: macos-latest
            asset: omb-atlassian-mcp-macos-universal
          - os: windows-latest
            asset: omb-atlassian-mcp-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build and stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          case "${{ matrix.os }}" in
            macos-latest)
              # Both slices, then fused into one universal binary.
              rustup target add aarch64-apple-darwin x86_64-apple-darwin
              cargo build --release --locked --target aarch64-apple-darwin
              cargo build --release --locked --target x86_64-apple-darwin
              lipo -create -output "staging/${{ matrix.asset }}" \
                "target/aarch64-apple-darwin/release/$BIN" \
                "target/x86_64-apple-darwin/release/$BIN"
              ;;
            windows-latest)
              cargo build --release --locked
              cp "target/release/$BIN.exe" "staging/${{ matrix.asset }}"
              ;;
            *)
              cargo build --release --locked
              cp "target/release/$BIN" "staging/${{ matrix.asset }}"
              ;;
          esac

          chmod +x "staging/${{ matrix.asset }}" || true
          # Smoke-test the artifact we are about to publish.
          "staging/${{ matrix.asset }}" --version

          cd staging
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            # macOS runners have shasum, not necessarily sha256sum.
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: staging/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Flatten the per-asset artifact directories into one folder.
          merge-multiple: true

      - name: Show what will be published
        run: ls -lR dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
